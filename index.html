<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestra semana</title>
<meta name="apple-mobile-web-app-title" content="Nuestra semana">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#1D2A23; --muted:#5E6B63; --line:#DCE2DC;
  --green:#2F6B4F; --green-soft:#E3EFE7; --him:#2E5C8A; --him-soft:#E4EDF6;
  --her:#A3476B; --her-soft:#F6E6ED; --kid:#C07419; --kid-soft:#FBEBD7;
  --thaw:#1F6F8B; --thaw-soft:#DDF0F6; --done:#9AA59E;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --text:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A17; --surface:#1D2521; --ink:#E8EEEA; --muted:#A3B0A8; --line:#2F3A34;
    --green:#7CC29C; --green-soft:#21362B; --him:#8DB7E2; --him-soft:#1E2C3A;
    --her:#E49BB8; --her-soft:#3A2330; --kid:#F0B266; --kid-soft:#3A2B18;
    --thaw:#7FCBE3; --thaw-soft:#183039; --done:#66726B; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A17; --surface:#1D2521; --ink:#E8EEEA; --muted:#A3B0A8; --line:#2F3A34;
  --green:#7CC29C; --green-soft:#21362B; --him:#8DB7E2; --him-soft:#1E2C3A;
  --her:#E49BB8; --her-soft:#3A2330; --kid:#F0B266; --kid-soft:#3A2B18;
  --thaw:#7FCBE3; --thaw-soft:#183039; --done:#66726B; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:6px}
main{max-width:620px;margin:0 auto;padding:12px 16px 110px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
h1{font-size:2.1rem;font-weight:800;letter-spacing:-0.02em}
h2{font-size:1.25rem;font-weight:700;margin:26px 0 10px}
h3{font-size:1.05rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* day strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:52px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 0 7px;text-align:center;cursor:pointer}
.day b{display:block;font-family:var(--display);font-size:1.35rem;line-height:1.1}
.day span{font-size:.78rem;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--bg)}
.day[aria-pressed="true"] span{color:var(--bg)}
.day.today:not([aria-pressed="true"]){border-color:var(--green)}

.datehead{margin:8px 0 4px}
.datehead .k{font-family:var(--display);font-weight:700;color:var(--green);font-size:1rem}

.thaw{margin:14px 0 4px;background:var(--thaw-soft);border-left:5px solid var(--thaw);border-radius:4px 14px 14px 4px;padding:12px 14px}
.thaw h3{color:var(--thaw);font-size:1rem;margin-bottom:4px}
.thaw ul{margin:0;padding-left:18px}

.meal{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0;cursor:pointer}
.meal .when{font-size:.85rem;color:var(--muted)}
.meal h3{font-size:1.2rem;margin:2px 0 8px}
.portions{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.82rem;border-radius:999px;padding:3px 10px;white-space:nowrap}
.p-him{background:var(--him-soft);color:var(--him)}
.p-her{background:var(--her-soft);color:var(--her)}
.p-kid{background:var(--kid-soft);color:var(--kid)}
.meal .go{float:right;color:var(--green);font-size:.85rem;font-weight:700}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:14px 16px;color:var(--muted);margin:10px 0}
.kidline{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border-radius:14px;background:var(--kid-soft);color:var(--ink);margin-top:10px}
.kidline b{color:var(--kid);white-space:nowrap}

.train{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.train{grid-template-columns:1fr}}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;border-top:5px solid var(--c)}
.tcard .who{font-family:var(--display);font-weight:700;color:var(--c)}
.tcard h3{margin:2px 0 6px;font-size:1.15rem}
.tcard ul{margin:6px 0 10px;padding-left:18px;font-size:.9rem}
.check{display:flex;align-items:center;gap:8px;border:1.5px solid var(--c);color:var(--c);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.9rem}
.check[aria-pressed="true"]{background:var(--c);color:var(--surface)}
.linkbtn{background:none;border:0;color:var(--green);font-weight:700;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.skip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 12px 4px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700;cursor:pointer}
.chip.main{border-color:var(--green);color:var(--green)}
.offcard{background:var(--surface);border:1.5px dashed var(--muted);border-radius:18px;padding:14px 16px;margin:10px 0}
.offcard h3{font-size:1.2rem;margin:2px 0 6px}
.offcard input{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;margin:4px 0 10px}
.offcard .when{font-size:.85rem;color:var(--muted)}

/* recipes list */
.rgroup{margin-top:18px}
.rrow{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0;cursor:pointer}
.rrow span{color:var(--muted);font-size:.85rem;white-space:nowrap}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 calc(env(safe-area-inset-bottom,0px) + 30px)}
.sheet[hidden]{display:none}
.sheet .in{max-width:620px;margin:0 auto;padding:0 16px}
.sheetbar{position:sticky;top:0;display:flex;justify-content:flex-end;padding:6px 0;background:var(--bg)}
.close{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700}
.sheet h1{font-size:1.8rem;margin:4px 0 4px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 8px;text-align:left;border-bottom:1px solid var(--line)}
thead th{font-family:var(--display);font-size:.9rem}
th.h-him{color:var(--him)} th.h-her{color:var(--her)} th.h-kid{color:var(--kid)}
.ing{columns:2;column-gap:20px;padding-left:18px;margin:0}
@media (max-width:420px){.ing{columns:1}}
.steps{padding-left:22px;margin:0}
.steps li{margin:0 0 10px}
.note{background:var(--kid-soft);border-radius:14px;padding:12px 14px;margin-top:16px}
.note b{color:var(--kid)}
.kidv{margin-top:8px;font-size:.88rem;color:var(--kid);font-weight:700}
.kidrec{background:var(--kid-soft);border-radius:18px;padding:14px 16px;margin-top:18px}
.kidrec h2{margin:2px 0 6px;color:var(--kid)}
.kidrec ul,.kidrec ol{padding-left:20px;margin:6px 0}
.kidrec li{margin-bottom:6px}
.tips{background:var(--kid-soft);border-radius:18px;padding:12px 16px;margin:14px 0}
.tips summary{font-family:var(--display);font-weight:700;color:var(--kid);cursor:pointer}
.tips ul{padding-left:20px;margin:8px 0 2px}
.tips li{margin-bottom:6px}
.flag{background:var(--her-soft);border-radius:14px;padding:12px 14px;margin:10px 0}

/* shopping */
.add{display:flex;gap:8px;margin:10px 0 4px}
.add input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
.add input.q{flex:0 0 92px}
.btn{border:0;background:var(--green);color:var(--bg);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.sec{font-family:var(--display);font-weight:700;margin:18px 0 4px;color:var(--green)}
.item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.box{flex:0 0 24px;height:24px;border:2px solid var(--green);border-radius:7px;display:grid;place-items:center;font-size:15px;color:var(--bg)}
.item.done .box{background:var(--green)}
.item.done .nm{text-decoration:line-through;color:var(--done)}
.item .qq{margin-left:auto;color:var(--muted);font-size:.88rem;white-space:nowrap}
.status{font-size:.85rem;color:var(--muted);margin:6px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* progress */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.pgrid{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:18px;padding:14px}
.pcard .who{font-family:var(--display);font-weight:700;color:var(--c)}
.pcard .big{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.1;margin-top:2px}
.pcard .big small{font-size:1rem;font-weight:700}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:.92rem;margin:10px 0}
.kv span{color:var(--muted)}
.deltas{font-size:.88rem;margin:6px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.deltas div{width:100%;color:var(--muted)}
.dl{border-radius:999px;padding:2px 9px;font-weight:700;background:var(--bg)}
.dl.good{background:var(--green-soft);color:var(--green)}
.dl.bad{background:var(--kid-soft);color:var(--kid)}
.spark{width:100%;height:auto;margin-top:6px}
.hin{width:70px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 6px;font:inherit;margin-left:6px}
.medform{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.fgrid label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);gap:3px}
.fgrid input{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 10px;font:inherit;min-width:0}
.fgrid .full{grid-column:1 / -1}
.calc{margin:12px 0;font-size:.92rem}
.hist{font-size:.9rem}
.hrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hrow .d{width:58px;color:var(--muted)}
.hrow .x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px 6px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav.tabs .row{display:flex;max-width:620px;width:100%}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:700;font-size:.86rem;padding:9px 2px;border-radius:12px}
nav.tabs a[aria-current="page"]{color:var(--green);background:var(--green-soft)}
section[hidden]{display:none}
@media (prefers-reduced-motion: no-preference){.meal,.day,.item{transition:background .15s, border-color .15s}}
</style>
</head>

};
const DAYS = Object.keys(D);

const WS = ["D","L","M","X","J","V","S"];

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

/* ---------- training logic ---------- */
function hisSession(dateIso){
  const d = parse(dateIso), base = new Date(2026,10,23);
  const diff = Math.round((d - base)/864e5), week = Math.floor(diff/7), dow = d.getDay();
  const alt = ((week % 2) + 2) % 2 === 0 ? ["A","B","A"] : ["B","A","B"];
  const idx = {1:0,3:1,5:2}[dow];
  if (idx !== undefined) return {kind:"fuerza", s: alt[idx]};
  if (dow === 2 || dow === 4) return {kind:"paseo", t:"Paseo de 40 min"};
  if (dow === 6) return {kind:"paseo", t:"Paseo largo"};
  return {kind:"descanso", t:"Descanso"};
}

function portions(r){
  const row = r.rows[0], heads = r.heads;
  const cls = {"Él":"p-him","Ella":"p-her","Niño":"p-kid"};
  return heads.map((h,i)=>`<span class="pill ${cls[h]}">${esc(h)} ${esc(row[i+1])}</span>`).join("");
}

/* ---------- progreso ---------- */
let meds = [], perf = {}, who = "ella";
const WHO = {ella:{n:"Ella",c:"var(--her)"}, el:{n:"Él",c:"var(--him)"}};
const MS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmtD = s => { const d = parse(s); return d.getDate()+" "+MS[d.getMonth()]; };
const nf = (x,d=1) => (x==null || isNaN(x)) ? "—" : Number(x).toLocaleString("es-ES",{minimumFractionDigits:d,maximumFractionDigits:d});
const num = v => { if (v==null) return null; const x = parseFloat(String(v).replace(",",".")); return isNaN(x) ? null : x; };
function medsOf(w){ return meds.filter(m=>m.who===w).sort((a,b)=> a.d<b.d ? -1 : a.d>b.d ? 1 : 0); }
function spark(list, key, color){
  const pts = list.filter(m=>typeof m[key]==="number");
  if (pts.length < 2) return `<p class="small muted">Con dos medidas o más veréis aquí la evolución del peso.</p>`;
  const W=280,H=70,p=6, vs=pts.map(m=>m[key]), mn=Math.min(...vs), mx=Math.max(...vs), r=(mx-mn)||1;
  const xy = pts.map((m,i)=>[p+i*(W-2*p)/(pts.length-1), H-p-(m[key]-mn)/r*(H-2*p)]);
  return `<svg viewBox="0 0 ${W} ${H}" class="spark" role="img" aria-label="Evolución del peso"><polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${xy.map(a=>a[0].toFixed(1)+","+a[1].toFixed(1)).join(" ")}"/>${xy.map(a=>`<circle cx="${a[0].toFixed(1)}" cy="${a[1].toFixed(1)}" r="3" fill="${color}"/>`).join("")}</svg>`;
}
function delta(a, b, unit, goodDown){
  if (a==null || b==null) return "";
  const x = b - a; if (Math.abs(x) < 0.05) return `<span class="dl">= ${unit}</span>`;
  const good = goodDown ? x < 0 : x > 0;
  return `<span class="dl ${good?"good":"bad"}">${x<0?"−":"+"}${nf(Math.abs(x))} ${unit}</span>`;
}
function weekTrainCount(w){
  const t = new Date(), dow = (t.getDay()+6)%7; let c = 0;
  for (let i=0;i<7;i++){ const k = iso(new Date(t.getFullYear(), t.getMonth(), t.getDate()-dow+i)); if (trainDone[k] && trainDone[k][w]) c++; }
  return c;
}
function personCard(w){
  const L = medsOf(w), first = L[0], last = L[L.length-1], h = num((perf[w]||{}).h);
  let s = `<div class="pcard" style="--c:${WHO[w].c}"><div class="who">${WHO[w].n}</div>`;
  if (!last) s += `<p class="muted small">Todavía no hay medidas.</p>`;
  else {
    const fk = (last.peso!=null && last.grasa!=null) ? last.peso*last.grasa/100 : null;
    const fk0 = (first.peso!=null && first.grasa!=null) ? first.peso*first.grasa/100 : null;
    const lean = fk!=null ? last.peso - fk : null, lean0 = fk0!=null ? first.peso - fk0 : null;
    const imc = (h && last.peso) ? last.peso/((h/100)**2) : null;
    s += `<div class="big">${nf(last.peso)} <small>kg</small></div><div class="small muted">Última medida: ${fmtD(last.d)}</div>
      <div class="kv"><span>Grasa</span><b>${nf(last.grasa)} %</b><span>Masa grasa</span><b>${nf(fk)} kg</b><span>Masa magra</span><b>${nf(lean)} kg</b>${last.musculo!=null?`<span>Masa muscular</span><b>${nf(last.musculo)} kg</b>`:""}${imc?`<span>IMC</span><b>${nf(imc)}</b>`:""}${last.visceral!=null?`<span>Grasa visceral</span><b>${nf(last.visceral)}</b>`:""}${last.agua!=null?`<span>Agua</span><b>${nf(last.agua)} %</b>`:""}</div>`;
    if (L.length > 1) s += `<div class="deltas"><div>Desde el ${fmtD(first.d)}</div>${delta(first.peso,last.peso,"kg",true)}${delta(fk0,fk,"kg grasa",true)}${delta(lean0,lean,"kg magra",false)}</div>`;
    s += spark(L, "peso", WHO[w].c);
  }
  s += `<p class="small">Entrenos marcados esta semana: <b>${weekTrainCount(w)}</b></p>`;
  s += `<label class="small muted">Altura (cm)<input class="hin" data-h="${w}" inputmode="decimal" value="${h?esc(h):""}" placeholder="—"></label></div>`;
  return s;
}
function renderProgreso(){
  const el = document.getElementById("v-progreso");
  if (el.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;
  let h = `<h1>Progreso</h1><p class="small muted">Pesaos el mismo día de la semana, en ayunas y después de ir al baño: así las medidas se comparan bien. Tras el parto, el agua corporal cambia mucho y la grasa que marca la báscula baila: fijaos en la tendencia de varias semanas, no en un día.</p>`;
  h += `<div class="pgrid">${personCard("ella")}${personCard("el")}</div>`;
  h += `<h2>Nueva medida</h2><form id="medform" class="medform" style="--c:${WHO[who].c}">
    <div class="seg" role="group" aria-label="De quién es la medida">${Object.keys(WHO).map(w=>`<button type="button" data-pick="${w}" aria-pressed="${w===who}">${WHO[w].n}</button>`).join("")}</div>
    <div class="fgrid">
      <label>Fecha<input type="date" id="m-d" value="${todayIso}"></label>
      <label>Peso (kg)<input id="m-peso" inputmode="decimal" placeholder="72,3"></label>
      <label>Grasa (%)<input id="m-grasa" inputmode="decimal" placeholder="24,3"></label>
      <label>Masa muscular (kg)<input id="m-musculo" inputmode="decimal" placeholder="Opcional"></label>
      <label>Agua (%)<input id="m-agua" inputmode="decimal" placeholder="Opcional"></label>
      <label>Grasa visceral<input id="m-visceral" inputmode="decimal" placeholder="Opcional"></label>
      <label class="full">Nota<input id="m-nota" placeholder="Cómo te sientes, qué has notado…"></label>
    </div>
    <div class="calc" id="m-calc">Escribe peso y grasa para ver tu masa grasa y masa magra.</div>
    <button class="btn" type="submit">Guardar medida</button></form>`;
  h += `<h2>Historial</h2>`;
  for (const w of Object.keys(WHO)){
    const L = medsOf(w).slice().reverse();
    h += `<h3 style="color:${WHO[w].c};margin-top:12px">${WHO[w].n}</h3><div class="hist">${L.length ? L.map(m=>`<div class="hrow"><span class="d">${fmtD(m.d)}</span><span>${nf(m.peso)} kg · ${nf(m.grasa)} %${m.nota?` · <span class="muted">${esc(m.nota)}</span>`:""}</span><button class="x" data-delmed="${esc(m.id)}" aria-label="Borrar medida del ${fmtD(m.d)}">✕</button></div>`).join("") : `<p class="small muted">Sin medidas.</p>`}</div>`;
  }
  el.innerHTML = h;
}
function updateCalc(){
  const p = num(document.getElementById("m-peso")?.value), g = num(document.getElementById("m-grasa")?.value), c = document.getElementById("m-calc");
  if (!c) return;
  if (p && g!=null){ const fk = p*g/100; c.innerHTML = `Masa grasa <b>${nf(fk)} kg</b> · masa magra <b>${nf(p-fk)} kg</b>`; }
  else c.textContent = "Escribe peso y grasa para ver tu masa grasa y masa magra.";
}
document.addEventListener("input", e=>{ if (e.target.id==="m-peso" || e.target.id==="m-grasa") updateCalc(); });
document.addEventListener("submit", async e=>{
  if (e.target.id !== "medform") return; e.preventDefault();
  const v = id => document.getElementById(id).value;
  const m = {who, d: v("m-d") || todayIso, peso: num(v("m-peso")), grasa: num(v("m-grasa")), musculo: num(v("m-musculo")), agua: num(v("m-agua")), visceral: num(v("m-visceral")), nota: v("m-nota").trim()};
  if (m.peso == null){ document.getElementById("m-calc").textContent = "Falta el peso."; document.getElementById("m-peso").focus(); return; }
  for (const k of Object.keys(m)) if (m[k] === null || m[k] === "") delete m[k];
  document.activeElement.blur();
  if (db){ try{ await db.collection("medidas").add(m); }catch(err){ document.getElementById("m-calc").textContent = "No se pudo guardar. Revisa la conexión."; return; } }
  else { meds.push({...m, id:"l"+Date.now()}); try{ localStorage.setItem("medidas-v1", JSON.stringify(meds)); }catch(err){} renderProgreso(); }
});
document.addEventListener("change", async e=>{
  const w = e.target.dataset && e.target.dataset.h; if (!w) return;
  const h = num(e.target.value); perf[w] = {h};
  if (db){ try{ await db.collection("perfiles").doc(w).set({h}); }catch(err){} }
  else { try{ localStorage.setItem("perfiles-v1", JSON.stringify(perf)); }catch(err){} }
  e.target.blur(); renderProgreso();
});
async function delMed(id){
  if (!confirm("¿Borrar esta medida?")) return;
  if (db){ try{ await db.collection("medidas").doc(id).delete(); }catch(err){} }
  else { meds = meds.filter(m=>m.id!==id); try{ localStorage.setItem("medidas-v1", JSON.stringify(meds)); }catch(err){} renderProgreso(); }
}

/* ---------- routing & events ---------- */
const VIEWS = ["hoy","recetas","entreno","compra","progreso"];
function route(){
  const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "hoy";
  for (const k of VIEWS) document.getElementById("v-"+k).hidden = k!==v;
  document.querySelectorAll("nav.tabs a").forEach(a=>{ if (a.dataset.v===v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
document.addEventListener("click", async e=>{
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.day){ sel = t.dataset.day; renderHoy(); }
  else if (t.dataset.r) openRecipe(t.dataset.r);
  else if (t.dataset.sess) openSession(t.dataset.sess);
  else if (t.dataset.her) openHer();
  else if ("close" in t.dataset) closeSheet();
  else if (t.dataset.item) toggleItem(t.dataset.item);
  else if (t.id === "clearDone") clearDone();
  else if (t.id === "uncheck") uncheckAll();
  else if (t.dataset.done) toggleTrain(t.dataset.done);
  else if (t.dataset.skip) setOff(t.dataset.skip, {t: t.dataset.t, n: ""});
  else if (t.dataset.unskip) setOff(t.dataset.unskip, null);
  else if (t.dataset.pick){ who = t.dataset.pick; const f = document.getElementById("medform"); f.style.setProperty("--c", WHO[who].c); f.querySelectorAll("[data-pick]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.pick===who)); }
  else if (t.dataset.delmed) delMed(t.dataset.delmed);
});
document.addEventListener("submit", e=>{
  if (e.target.id !== "addform") return; e.preventDefault();
  const n = document.getElementById("nm").value.trim(), q = document.getElementById("qt").value.trim();
  if (!n) return; addItem(n,q); document.getElementById("nm").value=""; document.getElementById("qt").value="";
  document.getElementById("nm").focus();
});
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && !sheet.hidden) closeSheet(); });

async function toggleTrain(who){
  const cur = trainDone[sel] || {}; const val = !cur[who];
  trainDone[sel] = {...cur, [who]:val}; renderHoy();
  if (db){ try{ await db.collection("entrenos").doc(sel).set({...cur, [who]:val}); }catch(e){} }
  else { try{ localStorage.setItem("entrenos-v1", JSON.stringify(trainDone)); }catch(e){} }
}

/* ---------- boot ---------- */
try{ trainDone = JSON.parse(localStorage.getItem("entrenos-v1")||"{}"); }catch(e){ trainDone = {}; }
try{ meds = JSON.parse(localStorage.getItem("medidas-v1")||"[]"); perf = JSON.parse(localStorage.getItem("perfiles-v1")||"{}"); }catch(e){}
renderHoy(); renderRecetas(); renderEntreno(); renderProgreso(); loadLocal(); shopLocal = true;
shopNote = "Conectando la lista compartida…"; renderCompra(); route();

(async ()=>{
  let api = null;
  try { api = await (window.claude && window.claude.use ? window.claude.use("db") : null); } catch(e){ api = null; }
  if (!api){ shopNote = "Por ahora la lista se guarda solo en este móvil. En la lección 2 la compartimos entre los dos."; renderCompra(); return; }
  db = api;
  const timer = setTimeout(()=>{ flash("No se puede conectar con la lista compartida ahora mismo; puede estar desactualizada."); }, 10000);
  db.collection("compra").orderBy("o").onSnapshot(snap=>{
    if (!snap.metadata.fromCache) clearTimeout(timer);
    items = snap.docs.map(d=>({id:d.id, ...d.data()}));
    shopNote = snap.metadata.fromCache ? "Sincronizando…" : "Lista compartida: los cambios se ven al momento en ambos móviles.";
    renderCompra();
  }, err=>{ clearTimeout(timer); flash("No se pudo cargar la lista compartida."); });
  db.collection("medidas").onSnapshot(snap=>{ meds = snap.docs.map(d=>({id:d.id, ...d.data()})); renderProgreso(); }, ()=>{});
  db.collection("perfiles").onSnapshot(snap=>{ const m = {}; snap.docs.forEach(d=>{ m[d.id] = d.data(); }); perf = m; renderProgreso(); }, ()=>{});
  db.collection("comidas").onSnapshot(snap=>{
    const m = {}; snap.docs.forEach(d=>{ m[d.id] = d.data(); }); offMap = m;
    const a = document.activeElement; if (!(a && a.dataset && a.dataset.note)) renderHoy();
  }, ()=>{});
  db.collection("entrenos").onSnapshot(snap=>{
    const m = {}; snap.docs.forEach(d=>{ m[d.id] = d.data(); }); trainDone = m; renderHoy(); renderProgreso();
  }, ()=>{});
})();
</script>
</body>
</html>
